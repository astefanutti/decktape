version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      puppeteer:
        patterns:
          - puppeteer
          - puppeteer-core

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      image-bases:
        patterns:
          - node
          - debian
